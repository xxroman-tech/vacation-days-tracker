name: vacation-days-tracker

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: vacation_days
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    ports:
      - "${LAN_IP:?Set LAN_IP to the Docker host's LAN IPv4 address}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    networks:
      - tracker
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vacation_app", "-d", "vacation_days"]
      interval: 5s
      timeout: 3s
      retries: 12

  quarkus:
    build: .
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/vacation_days
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      QUARKUS_HTTP_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracker
    ports:
      - "${LAN_IP:?Set LAN_IP to the Docker host's LAN IPv4 address}:${QUARKUS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  tracker:
    name: vacation-days-network

volumes:
  postgres-data:
